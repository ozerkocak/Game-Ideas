<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#efe1c9">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kum Şişesi</title>
<style>
:root{--bg1:#f7ecd9;--bg2:#e3cdab;--ink:#4b3a2b;--ink2:#8d765e;--card:#fffaf2;--gold:#f0b23a;--safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:radial-gradient(130% 85% at 50% 32%,var(--bg1) 0%,var(--bg2) 100%);font-family:ui-rounded,"SF Pro Rounded","Nunito",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(var(--safeT) + 8px) 14px 0;pointer-events:none}
.row1{display:flex;align-items:center;gap:8px;height:40px}
.ib{pointer-events:auto;width:40px;height:40px;border-radius:14px;background:rgba(255,250,242,.78);box-shadow:0 2px 8px rgba(75,58,43,.13);font-size:19px;display:grid;place-items:center}
#title{flex:1;text-align:center;font-weight:800;font-size:18px}
.row2{display:flex;align-items:center;gap:12px;margin-top:8px}
#pbar{position:relative;flex:1;height:14px;border-radius:8px;background:rgba(75,58,43,.13)}
#pfill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:8px;background:linear-gradient(90deg,#f3c46b,#e98a4b);transition:width .3s}
.mk{position:absolute;top:-4px;height:22px;border-left:2px solid rgba(255,255,255,.95)}
.mk::after{content:"★";position:absolute;left:-7px;top:20px;font-size:11px;color:var(--ink2)}
.mk.on::after{color:var(--gold)}
#pct{min-width:66px;text-align:right;font-weight:900;font-size:26px;font-variant-numeric:tabular-nums}
#queue{display:flex;gap:3px;margin-top:16px;height:16px}
.seg{position:relative;border-radius:5px;overflow:hidden;min-width:8px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.13)}
.seg .f{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.75)}
.seg.cur,.chip.cur{outline:2px solid rgba(75,58,43,.6);outline-offset:1px}
.chip{flex:0 0 20px;display:grid;place-items:center;font-size:12px;border-radius:5px;background:rgba(255,250,242,.85)}
.chip.done{opacity:.35}
#toast{position:fixed;left:0;right:0;top:36%;text-align:center;font-weight:900;font-size:24px;color:#fff;text-shadow:0 2px 0 rgba(75,58,43,.35),0 0 18px rgba(240,178,58,.7);opacity:0;transform:translateY(10px);transition:opacity .25s,transform .25s;pointer-events:none}
#toast.show{opacity:1;transform:none}
#banner{position:fixed;left:0;right:0;top:42%;text-align:center;pointer-events:none;opacity:0;transition:opacity .45s}
#banner.show{opacity:1}
#banner .bt{font-weight:900;font-size:32px;color:#fff;text-shadow:0 3px 0 rgba(75,58,43,.3),0 0 22px rgba(75,58,43,.25)}
#banner .bs{margin-top:4px;font-weight:700;font-size:15px;color:#fff;text-shadow:0 1px 6px rgba(75,58,43,.5)}
#hint{position:fixed;left:18px;right:18px;bottom:calc(var(--safeB) + 16px);text-align:center;font-size:15px;line-height:1.35;color:var(--ink2);pointer-events:none}
#hand{position:fixed;left:50%;bottom:calc(var(--safeB) + 74px);margin-left:-20px;font-size:40px;pointer-events:none;opacity:0;transition:opacity .3s}
#hand.show{opacity:1;animation:sway 1.6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translateX(-80px) rotate(-8deg)}50%{transform:translateX(80px) rotate(8deg)}}
#bPuff{position:fixed;right:14px;bottom:calc(var(--safeB) + 58px);height:48px;padding:0 16px;border-radius:24px;background:rgba(255,250,242,.92);box-shadow:0 3px 10px rgba(75,58,43,.2);font-size:20px;display:none}
#bPuff b{font-size:17px}
#bPuff.off{opacity:.4}
.sheet{position:fixed;left:12px;right:12px;bottom:calc(var(--safeB) + 12px);background:var(--card);border-radius:24px;padding:12px 16px 14px;box-shadow:0 10px 40px rgba(75,58,43,.28);transform:translateY(140%);transition:transform .5s cubic-bezier(.2,.9,.3,1.15);text-align:center}
.sheet.show{transform:none}
.sheet h2{margin:0;font-size:20px}
.sheet .big{font-size:38px;font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums}
.sheet .big small{font-size:15px;font-weight:700;color:var(--ink2)}
.stars{margin:2px 0 4px}
.stars span{display:inline-block;font-size:36px;color:#e8dccb;transform:scale(.5);transition:transform .35s cubic-bezier(.3,1.8,.5,1),color .2s}
.stars span.on{color:var(--gold);transform:scale(1);text-shadow:0 0 14px rgba(240,178,58,.6)}
.sheet p{margin:2px 0 10px;color:var(--ink2);font-size:13px;line-height:1.3}
.btns{display:flex;gap:10px}
.btn{flex:1;height:48px;border-radius:16px;font-weight:800;font-size:17px}
.btn.pri{background:linear-gradient(180deg,#f3a35a,#e07f45);color:#fff;box-shadow:0 4px 0 #b9612f}
.btn.sec{background:#f1e6d6;box-shadow:0 4px 0 #dccbb3}
.btn:disabled{opacity:.45}
#raf{position:fixed;inset:0;background:radial-gradient(130% 85% at 50% 20%,#f8eedd 0%,#e6d2b2 100%);padding:calc(var(--safeT) + 14px) 16px calc(var(--safeB) + 16px);overflow-y:auto;touch-action:pan-y;display:none}
#raf.show{display:block}
#raf h1{margin:6px 0 2px;font-size:28px;text-align:center}
#raf .sub{text-align:center;color:var(--ink2);font-size:14px;margin-bottom:14px}
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 6px;position:relative;margin-bottom:22px}
.shelf::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:12px;border-radius:4px;background:linear-gradient(#cfa274,#a87c53);box-shadow:0 6px 10px rgba(75,58,43,.2)}
.slot{display:flex;flex-direction:column;align-items:center;gap:3px;padding-bottom:4px}
.jar{width:74px;height:90px;display:grid;place-items:end center;position:relative}
.jar img{width:74px;height:90px;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 3px 3px rgba(75,58,43,.25))}
.jar .empty{width:58px;height:72px;border-radius:10px 10px 16px 16px;border:2px solid rgba(255,255,255,.85);background:rgba(255,255,255,.28);display:grid;place-items:center;font-size:22px;color:var(--ink2)}
.slot .nm{font-size:12px;font-weight:800}
.slot .st{font-size:13px;color:var(--gold);letter-spacing:1px}
.slot .st i{font-style:normal;color:#d9cab4}
.slot.lock{opacity:.5}
.slot.next .empty{border-color:#f0b23a;box-shadow:0 0 0 4px rgba(240,178,58,.25)}
.set{display:flex;gap:10px;justify-content:center;margin:8px 0 10px}
.set button{height:42px;padding:0 14px;border-radius:14px;background:rgba(255,250,242,.85);font-weight:700;font-size:14px}
#rafClose{display:block;margin:6px auto 0;width:220px}
button:focus-visible{outline:3px solid #e07f45;outline-offset:2px}
@media (prefers-reduced-motion:reduce){#hand.show{animation:none}.sheet,.stars span,#toast,#banner,#pfill{transition:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="row1"><button id="bRaf" class="ib" aria-label="Raf">▤</button><div id="title"></div><button id="bRe" class="ib" aria-label="Baştan">↻</button></div>
  <div class="row2"><div id="pbar"><div id="pfill"></div><i class="mk" id="m1"></i><i class="mk" id="m2"></i><i class="mk" id="m3"></i></div><div id="pct">%0</div></div>
  <div id="queue"></div>
</div>
<div id="banner"><div class="bt"></div><div class="bs"></div></div>
<div id="toast"></div>
<div id="hint"></div>
<div id="hand">👆</div>
<button id="bPuff">💨 <b>3</b></button>
<div id="result" class="sheet">
  <h2 id="rTitle"></h2>
  <div class="big" id="rPct"></div>
  <div class="stars" id="rStars"><span>★</span><span>★</span><span>★</span></div>
  <p id="rMsg"></p>
  <div class="btns"><button class="btn sec" id="rAgain">Tekrar</button><button class="btn pri" id="rNext">Sonraki</button></div>
</div>
<div id="raf">
  <h1>Rafım</h1>
  <div class="sub" id="rafSub"></div>
  <div id="shelves"></div>
  <div class="set"><button id="sSnd"></button><button id="sHap"></button></div>
  <button class="btn sec" id="rafClose">Devam</button>
</div>
<script>
'use strict';
// ───────── Sabitler ─────────
// Izgara: 150×200 hücre. Cam ağzı MOUTH satırında, dibi YB satırında. Hedef dolgu FILLH satır.
const W=150,H=200,N=W*H,CX=75,MOUTH=40,YB=192,FILLH=140,FILLTOP=YB-FILLH+1,NOZY=22,TOL=2,DT=1/60;
const GRAV=0.18,VMAX=4.5,ROLLK=3,BEAT=0.34,HOLD=2.6,GAIN=1.25,SCALE=16;
const IS_IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const CPX=window.Capacitor,NATIVE=!!(CPX&&CPX.isNativePlatform&&CPX.isNativePlatform()),PLG=(NATIVE&&CPX.Plugins)||{};

let seed=1;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}
function gauss(){return Math.sqrt(-2*Math.log(rnd()+1e-9))*Math.cos(6.2832*rnd());}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const hex=h=>{const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255];};

// ───────── Kayıt ─────────
const SKEY='kumSisesi.v1';
let SAVE={lv:{},snd:true,hap:true,seen:false};
try{const s=JSON.parse(localStorage.getItem(SKEY)||'null');if(s&&typeof s==='object')SAVE=Object.assign(SAVE,s);}catch(e){}
function persist(){try{localStorage.setItem(SKEY,JSON.stringify(SAVE));}catch(e){}}

// ───────── Renkler, süsler, bölümler ─────────
const PAL={kum:'#e9c27b',deniz:'#3d8fd1',gok:'#a9d9f2',toprak:'#8b5e3c',cimen:'#7cc25a',turuncu:'#f39a48',pembe:'#ef8aa4',mor:'#8c6cc3',
 dag:'#8e87ad',kar:'#f4f6fb',nehir:'#4fb3e3',koyuDeniz:'#2b67a8',sari:'#f6d35b',colKumu:'#e9a85c',acikSari:'#fbe3a0',lacivert:'#3a4688',
 gece:'#1d2552',koyuToprak:'#4b3a33',koyuYesil:'#3e8c50',gece2:'#2c3a78'};

const SPR={
 tekne:{e:'⛵',c:{m:'#6b4a2f',s:'#e8584a',h:'#9c5a33'},p:['......m......','......mss....','......msss...','......mssss..','......m......','hhhhhhhhhhhhh','.hhhhhhhhhhh.','..hhhhhhhhh..']},
 kaktus:{e:'🌵',c:{g:'#3f8f4a'},p:['...g...','..ggg..','..ggg.g','g.ggg.g','g.ggggg','ggggg..','..ggg..','..ggg..','..ggg..','..ggg..','..ggg..']},
 gunes:{e:'☀️',c:{o:'#f08a2c',y:'#ffd34d'},p:['...ooo...','.ooooooo.','.ooyyyoo.','ooyyyyyoo','ooyyyyyoo','ooyyyyyoo','.ooyyyoo.','.ooooooo.','...ooo...']},
 kugu:{e:'🦢',c:{w:'#ffffff',k:'#f29a3a'},p:['..ww.......','.kww.......','..ww.......','..w........','..w...www..','..wwwwwwww.','...wwwwwww.','....wwwww..']},
 agac:{e:'🌳',c:{d:'#2f7d3e',t:'#6b4a2f'},p:['....d....','...ddd...','..ddddd..','...ddd...','..ddddd..','.ddddddd.','..ddddd..','.ddddddd.','ddddddddd','....t....','....t....','....t....']},
 ay:{e:'🌙',c:{a:'#fff3b0'},p:['..aaaa...','.aaaaa...','aaaaa....','aaaa.....','aaaa.....','aaaa.....','aaaaa....','.aaaaa...','..aaaa...']},
 yildiz:{e:'⭐',c:{y:'#fff1a8'},p:['...y...','...y...','yyyyyyy','.yyyyy.','..yyy..','.yy.yy.','yy...yy']}
};
for(const k in SPR){const o=SPR[k];o.h=o.p.length;o.w=o.p[0].length;o.cells=[];o.p.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch!=='.'){const r=hex(o.c[ch]);o.cells.push([x,y,(r[0]<<16)|(r[1]<<8)|r[2]]);}}));}

// Katman üst sınırları u∈[0,1] (camın sol→sağ) için dolgu yüksekliğinin oranı. Eğim ≤ 0,5 kalmalı (kum 34°'de durur).
const flat=h=>()=>h, lin=(a,b)=>u=>a+(b-a)*u;
const bump=(c,w,a)=>u=>Math.abs(u-c)<w?a*(1+Math.cos(Math.PI*(u-c)/w))/2:0;
const tri=(c,h,k)=>u=>h-k*Math.abs(u-c);
const add=(...f)=>u=>f.reduce((s,q)=>s+q(u),0), mx=(...f)=>u=>Math.max(...f.map(q=>q(u)));
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const dag5=mx(flat(.12),tri(.33,.42,.5),tri(.74,.36,.5));
const dag10=mx(flat(.1),tri(.28,.46,.5),tri(.75,.38,.5));
const nehir6=mx(flat(.12),tri(.5,.26,.5));
const tepe9=mx(flat(.1),tri(.75,.42,.5));

const LEVELS=[
 {ad:'Kumsal',sekil:'kavanoz',ortam:'deniz',akis:520,kok:64,ipucu:'Ekranın her yerinden sağa sola kaydır. Kumu silik çizgilere göre düz yay.',
  katman:[['kum',flat(.34)],['deniz',flat(.68)],['gok',flat(1)]]},
 {ad:'Tepe',sekil:'kavanoz',ortam:'ruzgar',akis:540,kok:62,ipucu:'Sağda biraz bekle: kum yığılır, tepe olur.',
  katman:[['toprak',flat(.2)],['cimen',mx(flat(.27),tri(.62,.52,.5))],['gok',flat(1)]]},
 {ad:'Koy',sekil:'kase',ortam:'deniz',akis:560,kok:65,ipucu:'Kumu sağa yığ, deniz solda derin kalsın.',
  katman:[['kum',lin(.08,.46)],['deniz',flat(.56)],['turuncu',flat(.8)],['pembe',flat(1)]]},
 {ad:'Tekne',sekil:'kavanoz',ortam:'deniz',akis:560,kok:60,ipucu:'Kumsal solda yükselir. Deniz bitince tekne gelir: halkanın üstüne getir, dokun ve bırak.',
  katman:[['kum',lin(.42,.12)],['deniz',flat(.6)],['gok',flat(1)]],sus:[{id:'tekne',katman:1,oran:1,u:.62}]},
 {ad:'Dağlar',sekil:'vazo',ortam:'ruzgar',akis:600,kok:62,ipucu:'Önce iki zirveyi yığ. Kar sadece tepelere.',
  katman:[['toprak',flat(.12)],['dag',dag5],['kar',u=>dag5(u)+.045*smooth(.28,.36,dag5(u))],['turuncu',flat(.78)],['mor',flat(1)]]},
 {ad:'Vadi',sekil:'kavanoz',ortam:'ruzgar',akis:600,kok:64,ipucu:'Nehri ortaya dök, yeşili kenarlara yığ.',
  katman:[['toprak',flat(.12)],['nehir',nehir6],['cimen',mx(nehir6,u=>.27+.5*Math.abs(u-.5))],['gok',flat(1)]]},
 {ad:'Çöl',sekil:'kase',ortam:'ruzgar',akis:620,kok:63,ipucu:'İki kumul yap. Kaktüs birinci kumulun tepesine, güneş göğün ortasına.',
  katman:[['colKumu',mx(flat(.18),tri(.22,.42,.5),tri(.78,.5,.5))],['acikSari',flat(.72)],['gok',flat(1)]],
  sus:[{id:'kaktus',katman:0,oran:1,u:.22},{id:'gunes',katman:2,oran:.45,u:.62}]},
 {ad:'Gün batımı',sekil:'kadeh',ortam:'deniz',akis:640,kok:65,ufle:3,ipucu:'İnce katmanlar: hızlı süpür. Bir yer fazla yığılırsa çift dokun ya da 💨 ile üfle.',
  katman:[['koyuDeniz',flat(.2)],['deniz',flat(.34)],['sari',flat(.48)],['turuncu',flat(.62)],['pembe',flat(.78)],['mor',flat(1)]]},
 {ad:'Göl',sekil:'kavanoz',ortam:'ruzgar',akis:640,kok:60,ufle:3,ipucu:'Toprağı sağa yığ, göl solda düz kalsın. Kuğu göle, ağaç tepeye.',
  katman:[['toprak',tepe9],['nehir',flat(.24)],['cimen',mx(flat(.24),u=>tepe9(u)+.07)],['gok',flat(1)]],
  sus:[{id:'kugu',katman:1,oran:1,u:.2},{id:'agac',katman:2,oran:1,u:.75}]},
 {ad:'Gece',sekil:'kavanoz',ortam:'gece',akis:660,kok:57,minor:true,ufle:3,ipucu:'Önce dağlar, sonra gece. Yıldız ve ay gökyüzünün içinde asılı kalsın.',
  katman:[['koyuToprak',flat(.1)],['lacivert',dag10],['gece',flat(1)]],
  sus:[{id:'yildiz',katman:2,oran:.3,u:.2},{id:'ay',katman:2,oran:.65,u:.66}]}
];
const STAR_TH=[55,75,90];

// Camın her satırdaki yarı genişliği (dy: dipten yukarı satır). Hepsi yukarı doğru genişler, böylece her köşeye kum ulaşır.
function halfW(s,dy){const t=dy/(YB-MOUTH);
 if(s==='kavanoz'){const r=12;return dy<r?63-r+Math.sqrt(r*r-(r-dy-.5)**2):63;}
 if(s==='kase')return t<.55?Math.max(8,63*Math.sqrt(1-((.55-t)/.55)**2)):63;
 if(s==='kadeh')return 16+47*Math.pow(t,.75);
 if(s==='vazo')return 40+23*Math.pow(t,1.6);
 return 63;}

// ───────── Izgara ─────────
// g: 0 hava, 1 katı (cam dışı), 2 süs, 3+ kum (renk = g-3). sh: tanenin kendi tonu (taneyle birlikte taşınır).
const g=new Uint8Array(N),sh=new Uint8Array(N),inside=new Uint8Array(N),rim=new Uint8Array(N),tgt=new Uint8Array(N),okm=new Uint16Array(N),bnd=new Uint8Array(N),dcol=new Uint32Array(N),dlay=new Uint8Array(N);
let LV=0,L=null,BOT=false,ncol=0,pr=[],pg=[],pb=[],amounts=[],queue=[],qi=0,gx0=0,gx1=0,hwMouth=63,hwTop=63,hwBot=63,lo=0,hi=0;
let colBot=new Int16Array(W),topRow=[],cyl=new Float32Array(W),decorList=[],layerRow=[],glassPts=[],scoreCols=[],layerScore=[];
let parts=[],active=[],noz=CX,nozT=CX,state='ready',T=0,pourStart=0,emitAcc=0,emitting=false,onTarget=false,streakT=0,offT=9,streakLvl=0;
let nextBeat=0,mi=0,melody=[],pct=0,puffs=0,decor=null,holdT=0,settleT=0,finT=0,popped=false,waveY=-99,sweep=-1,lidY=null,resultShown=false;
let pendingCheck=null,nextTick=0,tickDue=false,floaters=[],confetti=[],wavePlayed=[],prevState=null,finalStars=0,nextCricket=0;

function buildLevel(){
 g.fill(0);sh.fill(0);inside.fill(0);rim.fill(0);tgt.fill(0);okm.fill(0);bnd.fill(0);dcol.fill(0);dlay.fill(0);
 const S=L.sekil;hwMouth=halfW(S,YB-MOUTH);hwTop=halfW(S,YB-FILLTOP);hwBot=halfW(S,0);
 lo=Math.ceil(CX-hwMouth+2);hi=Math.floor(CX+hwMouth-3);
 for(let y=0;y<H;y++){const hw=y>YB?-1:y<MOUTH?hwMouth:halfW(S,YB-y);
  for(let x=0;x<W;x++){const i=y*W+x,ins=Math.abs(x+.5-CX)<hw;if(ins&&y>=MOUTH)inside[i]=1;else if(!ins)g[i]=1;}}
 // cam duvarı: içe 1-2 hücre (dipte 3) mesafedeki katı hücreler
 for(let y=MOUTH;y<H;y++)for(let x=2;x<W-2;x++){const i=y*W+x;if(g[i]!==1)continue;let dm=9;
  for(let dy=-3;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const yy=y+dy;if(yy<MOUTH||yy>=H||!inside[yy*W+x+dx])continue;const d=Math.max(Math.abs(dx),dy===-3?2:Math.abs(dy));if(d<dm)dm=d;}
  if(dm<=2)rim[i]=dm;}
 // hedef
 gx0=CX-hwTop;gx1=CX+hwTop;ncol=L.katman.length;
 pr=[];pg=[];pb=[];L.katman.forEach(k=>{const r=hex(PAL[k[0]]);pr.push(r[0]);pg.push(r[1]);pb.push(r[2]);});
 const colB=[];for(let x=0;x<W;x++){const u=clamp((x+.5-gx0)/(gx1-gx0),0,1);let b=0;const a=new Float32Array(ncol);
  for(let k=0;k<ncol;k++){b=Math.max(b,L.katman[k][1](u));if(k===ncol-1)b=1;a[k]=b;}colB.push(a);}
 amounts=new Array(ncol).fill(0);
 for(let y=FILLTOP;y<=YB;y++){const v=(YB-y+.5)/FILLH;for(let x=0;x<W;x++){const i=y*W+x;if(!inside[i])continue;const a=colB[x];
  for(let k=0;k<ncol;k++)if(v<a[k]){tgt[i]=k+1;amounts[k]++;break;}}}
 // hoşgörü maskesi: sınıra TOL hücreden yakın her renk o hücrede doğru sayılır

  if(m===ROLLK)active[w++]=i;else if(i<(MOUTH+1)*W)g[i]=0;}

  const n=Math.max(1,Math.ceil(Math.max(Math.abs(p.vx),Math.abs(p.vy))));let landed=false;

   if(g[Math.floor(ny)*W+Math.round(nx)]!==0){land(Math.round(p.x),Math.floor(p.y),p.c,p.s);landed=true;break;}

 const ph=[rnd()*6.28,rnd()*6.28,rnd()*6.28],am=pn?[gauss()*pn,gauss()*pn,gauss()*pn]:[0,0,0];

 for(let x=lo;x<=hi;x++){let f=0;for(let k=-4;k<=4;k++)f+=fl[clamp(x+k,lo,hi)];def[x]=colSurf(x)-1-topRow[c][x]-f/9+am[0]*Math.sin(x*.05+ph[0])+am[1]*Math.sin(x*.11+ph[1])+am[2]*Math.sin(x*.23+ph[2]);}
 for(let x=lo;x<=hi;x++){let s=0,n=0;for(let k=-3;k<=3;k++){const xx=x+k;if(xx>=lo&&xx<=hi){s+=def[xx];n++;}}out[x]=s/n;}
 return out;}
function botThink(pf,B){
 if(pf==='dokunmayan')return;
 if(pf==='supurucu'){if(state==='hold')return;nozT=noz+B.dir*85*DT;if(nozT>=hi)B.dir=-1;if(nozT<=lo)B.dir=1;return;}
 const P={kusursuz:{vb:120,vmax:240,vmin:10,re:0,bn:0,sn:0,slow:1,pn:0},insan:{vb:95,vmax:150,vmin:18,re:.15,bn:3,sn:.3,slow:.8,pn:3},daginik:{vb:85,vmax:120,vmin:30,re:.35,bn:9,sn:.6,slow:.35,pn:7}}[pf];
 if(state==='hold'){if(B.hold!==decor.rec){B.hold=decor.rec;B.haim=decor.rec.zx+gauss()*P.bn*.7;}
  nozT=noz+clamp(B.haim-noz,-P.vmax*DT,P.vmax*DT);if(Math.abs(noz-B.haim)<1.2&&holdT>P.re+.2)releaseDecor();return;}
 const it=queue[qi];if(!it||it.t!=='kum')return;
 if(T>=B.next){B.next=T+P.re+DT;B.def=deficits(it.c,true,P.pn);let a=-1,b=-1,bx=lo;
  for(let x=lo;x<=hi;x++){if(B.def[x]>.5){if(a<0)a=x;b=x;}if(B.def[x]>B.def[bx])bx=x;}
  if(a<0)a=b=bx;let sm=0,sn=0;for(let x=a;x<=b;x++)if(B.def[x]>0){sm+=B.def[x];sn++;}B.mean=sn?sm/sn:0;
  B.a=a+gauss()*P.bn;B.b=Math.max(B.a,b+gauss()*P.bn);}
 const d=B.def[clamp(Math.round(noz),lo,hi)];
 let v=d<=0?P.vmax:clamp(P.vb*Math.pow((B.mean+2)/(d+2),P.slow),P.vmin,P.vmax);v*=Math.max(.3,1+gauss()*P.sn*.3);
 if(noz<B.a-1)B.dir=1;else if(noz>B.b+1)B.dir=-1;else if(B.dir>0&&noz>=B.b)B.dir=-1;else if(B.dir<0&&noz<=B.a)B.dir=1;
 nozT=noz+B.dir*v*DT;}
function runBot(pf,n,sd){startLevel(n,{bot:true,seed:sd||1});beginPour();pourStart=0;
 const B={dir:1,next:0,aim:null};let k=0;while(state!=='result'&&k<60*150){botThink(pf,B);step();k++;}
 const res={bot:pf,bolum:n+1,yuzde:+pct.toFixed(1),yildiz:starsFor(pct),sus:decorList.map(d=>d.ok?'✓':'✗').join(''),sn:+(k*DT).toFixed(1)};
 BOT=false;return res;}

window.__game={setTS:v=>{TS=v;},sim:ms=>{const n=Math.round(ms/1000/DT);for(let k=0;k<n;k++)step();},
 state:()=>({state,level:LV,pct:+pct.toFixed(1),stars:starsFor(pct),qi,ql:queue.length,parts:parts.length,active:active.length,noz,onTarget,streakLvl,puffs}),
 debug:v=>{DBG=v;},autoplay:pf=>{AUTO=pf?{pf,B:{dir:1,next:0,aim:null}}:null;},start:n=>startLevel(n),begin:()=>beginPour(),input:x=>{nozT=x;},release:()=>releaseDecor(),puff:()=>puff(),bot:runBot,levels:LEVELS.length};

// İlk açılış: menü yok, doğrudan 1. bölüm. Sonraki açılışlar raf.
resize();
if(!SAVE.seen)startLevel(0);else{startLevel(Math.min(LEVELS.length-1,Object.keys(SAVE.lv).length));openRaf();prevState=null;$('rafClose').style.display='none';}
requestAnimationFrame(frame);
</script>
