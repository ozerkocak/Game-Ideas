<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ead8bc">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kum Şişesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Sıcak, ışıklı bir atölye masası: üstte buzlu cam bilgi şeridi, ortada 3D kavanoz, altta ipucu. */
:root{--bg:#ead8bc;--ink:#4a3826;--ink2:#86705a;--glass:rgba(255,251,244,.62);--glassLine:rgba(255,255,255,.75);--gold:#f2b53c;--amber:#e3803f;
 --font:"Nunito",ui-rounded,"SF Pro Rounded",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;--safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);font-family:var(--font);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.frost{background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);border:1px solid var(--glassLine);box-shadow:0 6px 18px rgba(74,56,38,.12),inset 0 1px 0 rgba(255,255,255,.7)}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(var(--safeT) + 10px) 14px 0;pointer-events:none}
.row1{display:flex;align-items:center;gap:10px;height:42px}
.ib{pointer-events:auto;width:42px;height:42px;border-radius:50%;display:grid;place-items:center}
.ib svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#title{flex:1;display:flex;justify-content:center}
#title span{padding:8px 16px;border-radius:21px;font-weight:900;font-size:17px;letter-spacing:.2px}
#title b{color:var(--amber);font-weight:900;margin-right:6px}
.row2{display:flex;align-items:center;gap:12px;margin-top:10px;padding:8px 12px 18px 14px;border-radius:18px}
#pbar{position:relative;flex:1;height:12px;border-radius:7px;background:rgba(74,56,38,.14);box-shadow:inset 0 1px 2px rgba(74,56,38,.2)}
#pfill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:7px;background:linear-gradient(90deg,#f6cd72,#e98b45);box-shadow:0 0 10px rgba(240,170,70,.55),inset 0 1px 0 rgba(255,255,255,.55);transition:width .35s}
.mk{position:absolute;top:-4px;height:20px;border-left:2px solid rgba(255,255,255,.95)}
.mk::after{content:"★";position:absolute;left:-7px;top:18px;font-size:12px;line-height:1;color:rgba(134,112,90,.75)}
.mk.on::after{color:var(--gold);text-shadow:0 0 6px rgba(242,181,60,.8)}
#pct{min-width:70px;text-align:right;font-weight:900;font-size:27px;font-variant-numeric:tabular-nums;line-height:1}
#queue{display:flex;gap:4px;margin-top:10px;height:14px;padding:0 2px}
.seg{position:relative;border-radius:7px;overflow:hidden;min-width:10px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.35)}
.seg::before{content:"";position:absolute;inset:0;background:radial-gradient(rgba(255,255,255,.25) 1px,transparent 1.4px) 0 0/4px 4px,radial-gradient(rgba(0,0,0,.12) 1px,transparent 1.4px) 2px 2px/5px 5px}
.seg .f{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,251,244,.82)}
.seg.cur,.chip.cur{outline:2px solid rgba(74,56,38,.6);outline-offset:1px}
.chip{flex:0 0 22px;display:grid;place-items:center;font-size:12px;border-radius:7px;background:rgba(255,251,244,.85)}
.chip.done{opacity:.35}
#toast{position:fixed;left:0;right:0;top:35%;text-align:center;font-weight:900;font-size:25px;color:#fff;text-shadow:0 2px 0 rgba(74,56,38,.35),0 0 20px rgba(242,181,60,.85);opacity:0;transform:translateY(10px) scale(.96);transition:opacity .25s,transform .3s cubic-bezier(.3,1.6,.5,1);pointer-events:none}
#toast.show{opacity:1;transform:none}
#banner{position:fixed;left:0;right:0;top:44%;text-align:center;pointer-events:none;opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s}
#banner.show{opacity:1;transform:none}
#banner .bt{font-weight:900;font-size:36px;color:#fff;letter-spacing:.3px;text-shadow:0 3px 0 rgba(74,56,38,.28),0 0 26px rgba(74,56,38,.3)}
#banner .bs{margin-top:2px;font-weight:800;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:#fff;text-shadow:0 1px 8px rgba(74,56,38,.55)}
#hint{position:fixed;left:16px;right:16px;bottom:calc(var(--safeB) + 14px);text-align:center;font-size:14.5px;font-weight:700;line-height:1.35;color:var(--ink2);pointer-events:none;text-wrap:balance}
#hand{position:fixed;left:50%;bottom:calc(var(--safeB) + 78px);margin-left:-21px;font-size:42px;pointer-events:none;opacity:0;transition:opacity .3s;filter:drop-shadow(0 4px 6px rgba(74,56,38,.3))}
#hand.show{opacity:1;animation:sway 1.6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translateX(-80px) rotate(-8deg)}50%{transform:translateX(80px) rotate(8deg)}}
#bPuff{position:fixed;right:14px;bottom:calc(var(--safeB) + 62px);height:50px;padding:0 16px;border-radius:25px;font-size:20px;display:none;pointer-events:auto}
#bPuff b{font-size:17px;font-weight:900}
#bPuff.off{opacity:.4}
#gfxErr{position:fixed;left:24px;right:24px;top:45%;text-align:center;font-weight:800;color:var(--ink2);display:none}
.sheet{position:fixed;left:12px;right:12px;bottom:calc(var(--safeB) + 12px);border-radius:26px;padding:14px 16px 14px;transform:translateY(140%);transition:transform .55s cubic-bezier(.2,.9,.3,1.12);text-align:center;background:rgba(255,251,244,.86)}
.sheet.show{transform:none}
.sheet h2{margin:0;font-size:19px;font-weight:900}
.sheet .big{font-size:40px;font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums}
.sheet .big small{font-size:14px;font-weight:800;color:var(--ink2)}
.stars{margin:0 0 2px}
.stars span{display:inline-block;font-size:38px;color:rgba(134,112,90,.25);transform:scale(.5);transition:transform .4s cubic-bezier(.3,1.9,.5,1),color .2s}
.stars span.on{color:var(--gold);transform:scale(1);text-shadow:0 0 16px rgba(242,181,60,.75)}
.sheet p{margin:2px 0 10px;color:var(--ink2);font-size:13.5px;font-weight:700;line-height:1.3}
.btns{display:flex;gap:10px}
.btn{flex:1;height:50px;border-radius:17px;font-weight:900;font-size:17px}
.btn.pri{background:linear-gradient(180deg,#f5ab60,#e07c40);color:#fff;box-shadow:0 4px 0 #b65f2d,0 8px 16px rgba(224,124,64,.3)}
.btn.sec{background:#f2e7d7;box-shadow:0 4px 0 #dccab0}
.btn:active{transform:translateY(2px)}
.btn:disabled{opacity:.45}
#raf{position:fixed;inset:0;background:radial-gradient(130% 85% at 50% 18%,#f8eedd 0%,#e4cfae 100%);padding:calc(var(--safeT) + 16px) 16px calc(var(--safeB) + 16px);overflow-y:auto;touch-action:pan-y;display:none}
#raf.show{display:block}
#raf h1{margin:4px 0 0;font-size:30px;font-weight:900;text-align:center}
#raf .sub{text-align:center;color:var(--ink2);font-weight:800;font-size:14px;margin-bottom:16px}
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 6px;position:relative;margin-bottom:24px}
.shelf::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:12px;border-radius:4px;background:linear-gradient(#d0a275,#a67a50);box-shadow:0 7px 12px rgba(74,56,38,.22)}
.slot{display:flex;flex-direction:column;align-items:center;gap:3px;padding-bottom:4px;min-width:0}
.jar{width:82px;height:100px;display:grid;place-items:end center}
.jar img{width:82px;height:100px;object-fit:cover;border-radius:12px;filter:drop-shadow(0 3px 4px rgba(74,56,38,.25))}
.jar .empty{width:60px;height:76px;border-radius:12px 12px 18px 18px;border:2px solid rgba(255,255,255,.9);background:rgba(255,255,255,.3);display:grid;place-items:center;font-size:20px;font-weight:900;color:var(--ink2)}
.slot .nm{font-size:12px;font-weight:900}
.slot .st{font-size:13px;color:var(--gold);letter-spacing:1px}
.slot .st i{font-style:normal;color:#d9cab4}
.slot.lock{opacity:.5}
.slot.next .empty{border-color:var(--gold);box-shadow:0 0 0 4px rgba(242,181,60,.25)}
.set{display:flex;gap:10px;justify-content:center;margin:8px 0 10px;flex-wrap:wrap}
.set button{height:42px;padding:0 14px;border-radius:14px;background:rgba(255,251,244,.85);font-weight:800;font-size:14px}
#rafClose{display:block;margin:6px auto 0;width:220px}
button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
@media (prefers-reduced-motion:reduce){#hand.show{animation:none}.sheet,.stars span,#toast,#banner,#pfill{transition:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="row1"><button id="bRaf" class="ib frost" aria-label="Raf"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><div id="title"><span class="frost"></span></div><button id="bRe" class="ib frost" aria-label="Baştan"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg></button></div>
  <div class="row2 frost"><div id="pbar"><div id="pfill"></div><i class="mk" id="m1"></i><i class="mk" id="m2"></i><i class="mk" id="m3"></i></div><div id="pct">%0</div></div>
  <div id="queue"></div>
</div>
<div id="banner"><div class="bt"></div><div class="bs"></div></div>
<div id="toast"></div>
<div id="hint"></div>
<div id="hand">👆</div>
<div id="gfxErr">Bu cihazda 3D grafik açılamadı.</div>
<button id="bPuff" class="frost">💨 <b>3</b></button>
<div id="result" class="sheet frost">
  <h2 id="rTitle"></h2>
  <div class="big" id="rPct"></div>
  <div class="stars" id="rStars"><span>★</span><span>★</span><span>★</span></div>
  <p id="rMsg"></p>
  <div class="btns"><button class="btn sec" id="rAgain">Tekrar</button><button class="btn pri" id="rNext">Sonraki</button></div>
</div>
<div id="raf">
  <h1>Rafım</h1>
  <div class="sub" id="rafSub"></div>
  <div id="shelves"></div>
  <div class="set"><button id="sSnd"></button><button id="sHap"></button></div>
  <button class="btn sec" id="rafClose">Devam</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
// ───────── Sabitler ─────────
// Izgara: 210×280 hücre, her hücre bir kum tanesi. Cam ağzı MOUTH satırında, dibi YB satırında. Hedef dolgu FILLH satır.
const W=210,H=280,N=W*H,CX=105,MOUTH=56,YB=269,FILLH=196,FILLTOP=YB-FILLH+1,NOZY=31,RMAX=88,TOL=3,DT=1/60;
let SCALE=13;
const GRAV=.22,VMAX=5.5,SLEEPN=8,PASSES=3,AREA=1.96,SPRS=2;
let SPLASH=.2,FR=.7,MOMG=.45; // çarpma saçılması, yana kayma sürtünmesi, yamaçta hız kazanma
const BEAT=.34,HOLD=2.6,GAIN=1.25,WS=.01; // WS: bir hücrenin 3D dünyadaki boyu
const IS_IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const CPX=window.Capacitor,NATIVE=!!(CPX&&CPX.isNativePlatform&&CPX.isNativePlatform()),PLG=(NATIVE&&CPX.Plugins)||{};

let seed=1;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}
function gauss(){return Math.sqrt(-2*Math.log(rnd()+1e-9))*Math.cos(6.2832*rnd());}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const hex=h=>{const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255];};

// ───────── Kayıt ─────────
const SKEY='kumSisesi.v2';
let SAVE={lv:{},snd:true,hap:true,seen:false};
try{const s=JSON.parse(localStorage.getItem(SKEY)||'null');if(s&&typeof s==='object')SAVE=Object.assign(SAVE,s);}catch(e){}
function persist(){try{localStorage.setItem(SKEY,JSON.stringify(SAVE));}catch(e){}}

// ───────── Renkler, süsler, bölümler ─────────
const PAL={kum:'#e9c27b',deniz:'#3d8fd1',gok:'#a9d9f2',toprak:'#8b5e3c',cimen:'#7cc25a',turuncu:'#f39a48',pembe:'#ef8aa4',mor:'#8c6cc3',
 dag:'#8e87ad',kar:'#f4f6fb',nehir:'#4fb3e3',koyuDeniz:'#2b67a8',sari:'#f6d35b',colKumu:'#e9a85c',acikSari:'#fbe3a0',lacivert:'#3a4688',
 gece:'#1d2552',koyuToprak:'#4b3a33',koyuYesil:'#3e8c50'};

const SPR={
 tekne:{e:'⛵',c:{m:'#6b4a2f',s:'#e8584a',h:'#9c5a33'},p:['......m......','......mss....','......msss...','......mssss..','......m......','hhhhhhhhhhhhh','.hhhhhhhhhhh.','..hhhhhhhhh..']},
 kaktus:{e:'🌵',c:{g:'#3f8f4a'},p:['...g...','..ggg..','..ggg.g','g.ggg.g','g.ggggg','ggggg..','..ggg..','..ggg..','..ggg..','..ggg..','..ggg..']},
 gunes:{e:'☀️',c:{o:'#f08a2c',y:'#ffd34d'},p:['...ooo...','.ooooooo.','.ooyyyoo.','ooyyyyyoo','ooyyyyyoo','ooyyyyyoo','.ooyyyoo.','.ooooooo.','...ooo...']},
 kugu:{e:'🦢',c:{w:'#ffffff',k:'#f29a3a'},p:['..ww.......','.kww.......','..ww.......','..w........','..w...www..','..wwwwwwww.','...wwwwwww.','....wwwww..']},
 agac:{e:'🌳',c:{d:'#2f7d3e',t:'#6b4a2f'},p:['....d....','...ddd...','..ddddd..','...ddd...','..ddddd..','.ddddddd.','..ddddd..','.ddddddd.','ddddddddd','....t....','....t....','....t....']},
 ay:{e:'🌙',c:{a:'#fff3b0'},p:['..aaaa...','.aaaaa...','aaaaa....','aaaa.....','aaaa.....','aaaa.....','aaaaa....','.aaaaa...','..aaaa...']},
 yildiz:{e:'⭐',c:{y:'#fff1a8'},p:['...y...','...y...','yyyyyyy','.yyyyy.','..yyy..','.yy.yy.','yy...yy']}
};
// her piksel 2×2 hücre olur; art: 3D voksel için piksel listesi, cells: fizik için hücre listesi
for(const k in SPR){const o=SPR[k];o.art=[];o.cells=[];o.aw=o.p[0].length;o.ah=o.p.length;o.w=o.aw*SPRS;o.h=o.ah*SPRS;
 o.p.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch==='.')return;const r=hex(o.c[ch]),col=(r[0]<<16)|(r[1]<<8)|r[2];o.art.push([x,y,col]);
  for(let a=0;a<SPRS;a++)for(let b=0;b<SPRS;b++)o.cells.push([x*SPRS+a,y*SPRS+b,col]);}));}

// Katman üst sınırları u∈[0,1] (camın sol→sağ) için dolgu yüksekliğinin oranı. Eğim ≤ 0,5 kalmalı (kum 34°'de durur).
const flat=h=>()=>h, lin=(a,b)=>u=>a+(b-a)*u;
const tri=(c,h,k)=>u=>h-k*Math.abs(u-c);
const mx=(...f)=>u=>Math.max(...f.map(q=>q(u)));
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const dag5=mx(flat(.12),tri(.33,.42,.5),tri(.74,.36,.5));
const dag10=mx(flat(.1),tri(.28,.46,.5),tri(.75,.38,.5));
const nehir6=mx(flat(.12),tri(.5,.26,.5));
const tepe9=mx(flat(.1),tri(.75,.42,.5));
const yay=h=>u=>h-.07*Math.cos(6.2832*(u-.5)); // ortası çukur yay

const LEVELS=[
 {ad:'Kumsal',sekil:'kavanoz',ortam:'deniz',akis:520,kok:64,ipucu:'Ekranın her yerinden sağa sola kaydır. Kumu silik çizgilere göre düz yay.',
  katman:[['kum',flat(.34)],['deniz',flat(.68)],['gok',flat(1)]]},
 {ad:'Tepe',sekil:'kavanoz',ortam:'ruzgar',akis:540,kok:62,ipucu:'Sağda biraz bekle: kum yığılır, tepe olur.',
  katman:[['toprak',flat(.2)],['cimen',mx(flat(.27),tri(.62,.52,.5))],['gok',flat(1)]]},
 {ad:'Koy',sekil:'kase',ortam:'deniz',akis:560,kok:65,ipucu:'Kumu sağa yığ, deniz solda derin kalsın.',
  katman:[['kum',lin(.08,.46)],['deniz',flat(.56)],['turuncu',flat(.8)],['pembe',flat(1)]]},
 {ad:'Tekne',sekil:'kavanoz',ortam:'deniz',akis:560,kok:60,ipucu:'Kumsal solda yükselir. Deniz bitince tekne gelir: halkanın üstüne getir, dokun ve bırak.',
  katman:[['kum',lin(.42,.12)],['deniz',flat(.6)],['gok',flat(1)]],sus:[{id:'tekne',katman:1,oran:1,u:.62}]},
 {ad:'Dağlar',sekil:'vazo',ortam:'ruzgar',akis:600,kok:62,ipucu:'Önce iki zirveyi yığ. Kar sadece tepelere.',
  katman:[['toprak',flat(.12)],['dag',dag5],['kar',u=>dag5(u)+.045*smooth(.28,.36,dag5(u))],['turuncu',flat(.78)],['mor',flat(1)]]},
 {ad:'Vadi',sekil:'kavanoz',ortam:'ruzgar',akis:600,kok:64,ipucu:'Nehri ortaya dök, yeşili kenarlara yığ.',
  katman:[['toprak',flat(.12)],['nehir',nehir6],['cimen',mx(nehir6,u=>.27+.5*Math.abs(u-.5))],['gok',flat(1)]]},
 {ad:'Çöl',sekil:'kase',ortam:'ruzgar',akis:620,kok:63,ipucu:'İki kumul yap. Kaktüs birinci kumulun tepesine, güneş göğün ortasına.',
  katman:[['colKumu',mx(flat(.18),tri(.22,.42,.5),tri(.78,.5,.5))],['acikSari',flat(.72)],['gok',flat(1)]],
  sus:[{id:'kaktus',katman:0,oran:1,u:.22},{id:'gunes',katman:2,oran:.45,u:.62}]},
 {ad:'Gün batımı',sekil:'kadeh',ortam:'deniz',akis:640,kok:65,ufle:3,ipucu:'Katmanlar yay gibi: kenarlara daha çok dök, ortası çukur kalsın. Bir yer fazla yığılırsa çift dokun ya da 💨 ile üfle.',
  katman:[['koyuDeniz',yay(.22)],['deniz',yay(.36)],['sari',yay(.5)],['turuncu',yay(.64)],['pembe',yay(.8)],['mor',flat(1)]]},
 {ad:'Göl',sekil:'kavanoz',ortam:'ruzgar',akis:640,kok:60,ufle:3,ipucu:'Toprağı sağa yığ, göl solda düz kalsın. Kuğu göle, ağaç tepeye.',
  katman:[['toprak',tepe9],['nehir',flat(.24)],['cimen',mx(flat(.24),u=>tepe9(u)+.07)],['gok',flat(1)]],
  sus:[{id:'kugu',katman:1,oran:1,u:.2},{id:'agac',katman:2,oran:1,u:.75}]},
 {ad:'Gece',sekil:'kavanoz',ortam:'gece',akis:660,kok:57,minor:true,ufle:3,ipucu:'Önce dağlar, sonra gece. Yıldız ve ay gökyüzünün içinde asılı kalsın.',
  katman:[['koyuToprak',flat(.1)],['lacivert',dag10],['gece',flat(1)]],
  sus:[{id:'yildiz',katman:2,oran:.3,u:.2},{id:'ay',katman:2,oran:.65,u:.66}]}
];
const STAR_TH=[58,74,86];

// Camın her satırdaki iç yarı genişliği (dy: dipten yukarı satır). Hepsi yukarı doğru genişler, böylece her köşeye kum ulaşır.
function halfW(s,dy){const t=dy/(YB-MOUTH);
 if(s==='kavanoz'){const r=17;return dy<r?RMAX-r+Math.sqrt(r*r-(r-dy-.5)**2):RMAX;}
 if(s==='kase')return t<.55?Math.max(11,RMAX*Math.sqrt(1-((.55-t)/.55)**2)):RMAX;
 if(s==='kadeh')return 22+66*Math.pow(t,.75);
 if(s==='vazo')return 56+32*Math.pow(t,1.6);
 return RMAX;}

// ───────── Izgara ─────────
// g: 0 hava, 1 katı (cam), 2 süs, 3+ kum (renk = g-3). sh: tanenin tonu; vx, vy: hızı; slp: kaç adımdır kıpırdamadı.
const g=new Uint8Array(N),sh=new Uint8Array(N),vx=new Float32Array(N),vy=new Float32Array(N),slp=new Uint8Array(N),stp=new Uint8Array(N);
const inside=new Uint8Array(N),tgt=new Uint8Array(N),okm=new Uint16Array(N),bnd=new Uint8Array(N),dcol=new Uint32Array(N),dlay=new Uint8Array(N);
let LV=0,L=null,BOT=false,ncol=0,pr=[],pg=[],pb=[],amounts=[],queue=[],qi=0,gx0=0,gx1=0,hwMouth=RMAX,hwTop=RMAX,hwBot=RMAX,lo=0,hi=0,px0=0,px1=W-1;
let colBot=new Int16Array(W),topRow=[],decorList=[],layerRow=[],scoreCols=[],layerScore=[];
let parts=[],noz=CX,nozT=CX,state='ready',T=0,pourStart=0,emitAcc=0,emitting=false,onTarget=false,streakT=0,offT=9,streakLvl=0,moved=0,pass=0;
let nextBeat=0,mi=0,melody=[],pct=0,puffs=0,decor=null,holdT=0,settleT=0,finT=0,popped=false,waveY=-99,sweep=-1,lidY=null,resultShown=false,snapped=false;

function buildLevel(){
 g.fill(0);sh.fill(0);vx.fill(0);vy.fill(0);slp.fill(0);stp.fill(0);inside.fill(0);tgt.fill(0);okm.fill(0);bnd.fill(0);dcol.fill(0);dlay.fill(0);
 const SH=L.sekil;hwMouth=halfW(SH,YB-MOUTH);hwTop=halfW(SH,YB-FILLTOP);hwBot=halfW(SH,0);
 lo=Math.ceil(CX-hwMouth+3);hi=Math.floor(CX+hwMouth-4);px0=Math.floor(CX-hwMouth)-1;px1=Math.ceil(CX+hwMouth)+1;
 for(let y=0;y<H;y++){const hw=y>YB?-1:y<MOUTH?hwMouth:halfW(SH,YB-y);
  for(let x=0;x<W;x++){const i=y*W+x,ins=Math.abs(x+.5-CX)<hw;if(ins&&y>=MOUTH)inside[i]=1;else if(!ins)g[i]=1;}}
 gx0=CX-hwTop;gx1=CX+hwTop;ncol=L.katman.length;
 pr=[];pg=[];pb=[];L.katman.forEach(k=>{const r=hex(PAL[k[0]]);pr.push(r[0]);pg.push(r[1]);pb.push(r[2]);});
 const colB=[];for(let x=0;x<W;x++){const u=clamp((x+.5-gx0)/(gx1-gx0),0,1);let b=0;const a=new Float32Array(ncol);
  for(let k=0;k<ncol;k++){b=Math.max(b,L.katman[k][1](u));if(k===ncol-1)b=1;a[k]=b;}colB.push(a);}
 amounts=new Array(ncol).fill(0);
 for(let y=FILLTOP;y<=YB;y++){const v=(YB-y+.5)/FILLH;for(let x=0;x<W;x++){const i=y*W+x;if(!inside[i])continue;const a=colB[x];
  for(let k=0;k<ncol;k++)if(v<a[k]){tgt[i]=k+1;amounts[k]++;break;}}}
 // hoşgörü maskesi ve sınır çizgileri
 for(let y=FILLTOP;y<=YB;y++)for(let x=0;x<W;x++){const i=y*W+x,t0=tgt[i];if(!t0)continue;let m=0;
  for(let dy=-TOL;dy<=TOL;dy++)for(let dx=-TOL;dx<=TOL;dx++){const t=tgt[i+dy*W+dx];if(t)m|=1<<(t-1);}okm[i]=m;
  if((inside[i-W]&&tgt[i-W]!==t0)||(inside[i+W]&&tgt[i+W]!==t0)||(inside[i-1]&&tgt[i-1]!==t0)||(inside[i+1]&&tgt[i+1]!==t0))bnd[i]=1;}
 // sütun bilgisi: dip satırı ve her katman bitince sütunun bir sonraki boş satırı
 colBot=new Int16Array(W).fill(-1);topRow=[];for(let k=0;k<ncol;k++)topRow.push(new Int16Array(W));
 for(let x=0;x<W;x++){for(let y=YB;y>=MOUTH;y--)if(inside[y*W+x]){colBot[x]=y;break;}
  const cnt=new Array(ncol).fill(0);for(let y=FILLTOP;y<=YB;y++){const t=tgt[y*W+x];if(t)cnt[t-1]++;}
  let cum=0;for(let k=0;k<ncol;k++){cum+=cnt[k];topRow[k][x]=colBot[x]-cum;}}
 scoreCols=[];for(let x=0;x<W;x++)if(colBot[x]>=0&&colBot[x]-topRow[ncol-1][x]>0)scoreCols.push(x);
 layerRow=[];for(let k=0;k<ncol;k++){let s=0,n=0;for(let x=lo;x<=hi;x++){if(colBot[x]<0)continue;s+=topRow[k][x];n++;}layerRow.push(s/n);}
 // sıra: katmanlar alttan üste; süsler katmanın verilen oranında araya girer
 queue=[];decorList=[];
 for(let k=0;k<ncol;k++){const ds=(L.sus||[]).filter(s=>s.katman===k).sort((a,b)=>a.oran-b.oran);let used=0;
  for(const s of ds){const upto=Math.round(amounts[k]*s.oran);if(upto>used){queue.push({t:'kum',c:k,n:upto-used,n0:upto-used});used=upto;}
   const rec=decorRec(s,k);decorList.push(rec);queue.push({t:'sus',rec});}
  if(amounts[k]>used)queue.push({t:'kum',c:k,n:amounts[k]-used,n0:amounts[k]-used});}
 qi=0;
}
function decorRec(s,k){const spr=SPR[s.id],zx=Math.round(gx0+s.u*(gx1-gx0));
 const base=x=>k>0?topRow[k-1][x]:colBot[x],top=x=>topRow[k][x];let ne;
 if(s.oran>=1)ne=top(zx);
 else{const V=s.oran*amounts[k];let a=FILLTOP-40,b=YB+1;
  for(let it=0;it<40;it++){const R=(a+b)/2;let sum=0;for(let x=lo;x<=hi;x++){if(colBot[x]<0)continue;const bs=base(x),tp=top(x);sum+=Math.max(0,Math.min(bs-R,bs-tp));}
   if(sum>V)a=R;else b=R;}
  ne=Math.min(base(zx),Math.max(top(zx),(a+b)/2));}
 return{s,k,spr,zx,zy:ne-(spr.h-1)/2,ok:false,placed:false};}

// ───────── Kum fiziği ─────────
// Her tanenin hızı var. Düşerken ivmelenir, bir yere çarpınca hızının bir kısmı yana savrulmaya döner.
// Yamaçta kayan tane hız kazanır ve aynı karede birkaç hücre akar (çığ). Hareket eden tane çevresini uyandırır;
// yüzeydeki taneler hiç uyumaz, böylece dik kalan bir yer mutlaka kayar.
// Durma açısı: 3 yana 2 aşağı yol açıksa tane yana yürür → kum ~34°'de durur. Cam üstünde sürtünme daha az (~27°).
function wake(i){slp[i-W]=0;slp[i-W-1]=0;slp[i-W+1]=0;slp[i-1]=0;slp[i+1]=0;slp[i-2*W]=0;}
function mv(i,j){g[j]=g[i];sh[j]=sh[i];vx[j]=vx[i];vy[j]=vy[i];g[i]=0;vx[i]=0;vy[i]=0;slp[j]=0;stp[j]=pass;wake(i);return j;}
function upd(i){const b=i+W;let v=vy[i];
 if(g[b]===0){v=Math.min(v+GRAV,VMAX);let n=Math.max(1,Math.round(v)),j=i;while(n-->0&&g[j+W]===0)j+=W;
  const h=vx[i];if(h!==0){const d=h>0?1:-1;if((Math.abs(h)>=1||rnd()<Math.abs(h))&&g[j+d]===0)j+=d;}
  vy[i]=v;vx[i]=h*.97;return mv(i,j);}
 if(v>1.2)vx[i]+=(rnd()<.5?-1:1)*v*SPLASH*(.4+rnd()*.6);
 vy[i]=0;const h=vx[i],ah=Math.abs(h),d=ah>.05?(h>0?1:-1):(rnd()<.5?1:-1);
 if(g[b+d]===0){vx[i]=clamp(h+d*MOMG,-3,3);return mv(i,b+d);}
 if(ah<.3&&g[b-d]===0){vx[i]=-d*.45;return mv(i,b-d);}
 if(ah>=1&&g[i+d]===0){vx[i]=h*FR;return mv(i,i+d);}
 if(g[i+d]===0&&g[b+2*d]===0&&g[b+W+3*d]===0){vx[i]=d;return mv(i,i+d);}
 if(g[i-d]===0&&g[b-2*d]===0&&g[b+W-3*d]===0){vx[i]=-d;return mv(i,i-d);}
 if(g[b]===1){if(g[i+d]===0&&g[b+2*d]===0){vx[i]=d;return mv(i,i+d);}if(g[i-d]===0&&g[b-2*d]===0){vx[i]=-d;return mv(i,i-d);}}
 vx[i]=ah<.1?0:h*.5;return -1;}
function simPass(){pass=pass>=255?1:pass+1;let m=0;
 for(let y=YB;y>=NOZY;y--){const dir=((pass+y)&1)?1:-1;
  for(let k=px0;k<=px1;k++){const x=dir>0?k:px0+px1-k,i=y*W+x;if(g[i]<3||slp[i]>=SLEEPN||stp[i]===pass)continue;
   let j=upd(i);if(j<0){if(g[i-W]===0)slp[i]=0;else slp[i]++;continue;}m++;
   for(let k2=Math.floor(Math.min(3,Math.abs(vx[j])));k2>0&&vy[j]===0;k2--){const j2=upd(j);if(j2<0)break;j=j2;}
   if(j<(MOUTH+1)*W&&vy[j]===0&&g[j+W]!==0){g[j]=0;}}}  // ağzın üstünde kalan kum taşar
 return m;}
// Çarpan tane aynı anda saçılıp kayar; böylece akışın düştüğü sütunda tane birikip havada kule oluşmaz.
function land(x,y,c,s,pvx,pvy){let i=y*W+x;while(y>1&&g[i]!==0){y--;i-=W;}if(g[i]!==0||y<MOUTH+1)return;
 g[i]=3+c;sh[i]=s;vx[i]=pvx;vy[i]=pvy;slp[i]=0;stp[i]=0;wake(i);
 for(let k=0;k<8;k++){const j=upd(i);if(j<0){vy[i]=0;break;}i=j;if(vy[i]>0&&g[i+W]===0)break;}}
function updateParts(){const pl=CX-hwMouth+1,ph=CX+hwMouth-2;let w=0;
 for(let k=0;k<parts.length;k++){const p=parts[k];p.vy=Math.min(p.vy+GRAV,VMAX);
  const n=Math.max(1,Math.ceil(Math.max(Math.abs(p.vx),Math.abs(p.vy))));let landed=false;
  for(let s=0;s<n;s++){let nx=p.x+p.vx/n,ny=Math.max(1,p.y+p.vy/n);
   if(ny<MOUTH){if(nx<pl){nx=pl;p.vx=Math.abs(p.vx)*.5;}else if(nx>ph){nx=ph;p.vx=-Math.abs(p.vx)*.5;}}
   if(g[Math.floor(ny)*W+Math.round(nx)]!==0){land(Math.round(p.x),Math.floor(p.y),p.c,p.s,p.vx,p.vy);landed=true;break;}
   p.x=nx;p.y=ny;}
  if(!landed)parts[w++]=p;}
 parts.length=w;}
function colSurf(x){let y=NOZY+1;while(y<=YB&&g[y*W+x]===0)y++;return y;}

// ───────── Oyun akışı ─────────
function startLevel(n,opt={}){
 LV=n;L=LEVELS[n];BOT=!!opt.bot;seed=(opt.seed!=null?opt.seed:(Date.now()&0xffffff))||1;
 buildLevel();
 parts=[];noz=nozT=CX;state='ready';T=0;pourStart=1e9;emitAcc=0;emitting=false;onTarget=false;streakT=0;offT=9;streakLvl=0;moved=0;
 nextBeat=0;mi=0;melody=makeMelody(!!L.minor,n*7919+13);pct=0;puffs=L.ufle||0;decor=null;holdT=0;settleT=0;popped=false;waveY=-99;sweep=-1;lidY=null;
 resultShown=false;snapped=false;pendingCheck=null;nextTick=0;wavePlayed=[];finalStars=0;
 if(BOT)return;
 $('title').firstChild.innerHTML='<b>'+(n+1)+'</b>'+L.ad;$('hint').textContent=L.ipucu;
 buildQueueBar();lastPct=-1;hudDirty=true;
 ['m1','m2','m3'].forEach((id,k)=>{$(id).style.left=STAR_TH[k]+'%';$(id).classList.remove('on');});
 $('result').classList.remove('show');
 $('bPuff').style.display=puffs>0?'block':'none';updatePuffBtn();
 const bn=$('banner');bn.querySelector('.bt').textContent=L.ad;bn.querySelector('.bs').textContent='Bölüm '+(n+1)+(L.sus?' · süslü':'');
 bn.classList.add('show');clearTimeout(bn._t);bn._t=setTimeout(()=>bn.classList.remove('show'),1900);

function beginPour(){if(state!=='ready')return;state='pour';pourStart=T+.3;
 if(!BOT){$('hand').classList.remove('show');$('banner').classList.remove('show');if(!SAVE.seen){SAVE.seen=true;persist();}}}

function step(){
 if(state==='menu')return;
 T+=DT;if(AUTO&&!BOT)botThink(AUTO.pf,AUTO.B);
 const span=decor&&decor.held?decor.rec.spr.w:0;
 nozT=clamp(nozT,lo+(span?span/2-1:0),hi-(span?span/2:0));noz+=(nozT-noz)*.6;
 emitting=false;
 if(state==='pour')emit();
 else if(state==='hold'){holdT+=DT;decorFollow();if(holdT>=HOLD)releaseDecor();}
 else if(state==='drop')dropDecor();
 updateParts();moved=0;for(let p=0;p<PASSES;p++)moved+=simPass();
 if(state==='settle'){settleT+=DT;if((!parts.length&&moved===0&&settleT>.4)||settleT>5)startFinale();}
 if(state==='finale')finaleStep();
 if(state!=='ready'&&state!=='result'&&(Math.round(T/DT)%8===0))pct=score();
 if(pendingCheck&&T>=pendingCheck.at){layerCheck(pendingCheck.c);pendingCheck=null;}
 // akış serisi
 if(emitting){if(onTarget){streakT+=DT;offT=0;}else{offT+=DT;if(offT>.45)streakT=0;}}
 const nl=streakT>=14?3:streakT>=8?2:streakT>=3?1:0;
 if(nl>streakLvl&&!BOT){toast('Akış '+'♪'.repeat(nl));vib(12);}
 streakLvl=nl;
 if(BOT)return;
 // melodi: kum doğru yere düştükçe çalar, saparsan susar
 const playing=emitting&&(onTarget||offT<.2);
 if(!playing)nextBeat=Math.max(nextBeat,T);
 else if(T>=nextBeat){beat();nextBeat=T+BEAT;}
 // kum tanesi titreşimi
 if(emitting&&T>=nextTick){nextTick=T+.055+Math.random()*.05;if(PLG.Haptics||navigator.vibrate)vib(onTarget?7:4,true);else tickDue=true;}
 setHiss(emitting?(onTarget?.24:.19):0);
 if(L.ortam==='gece'&&T>=nextCricket){nextCricket=T+.9+Math.random()*.9;cricket();}
}
function emit(){
 if(T<pourStart)return;
 const it=queue[qi];if(!it){state='settle';return;}
 if(it.t==='sus'){beginHold(it.rec);return;}
 emitAcc+=L.akis*AREA*DT;let k=Math.min(Math.floor(emitAcc),it.n);emitAcc-=Math.floor(emitAcc);
 for(let j=0;j<k;j++)parts.push({x:noz+(rnd()+rnd()-1)*1.8,y:NOZY,z:(rnd()-.5)*2.4,vx:(rnd()-.5)*.1,vy:.6+rnd()*.6,c:it.c,s:(rnd()*255)|0});
 it.n-=k;emitting=k>0;
 if(emitting){const x=Math.round(noz),ly=colSurf(x)-1,i=ly*W+x;landX=x;landY=ly;onTarget=tgt[i]>0&&((okm[i]>>it.c)&1)===1;}
 if(it.n<=0){qi++;itemDone(it);}
}
function itemDone(it){
 const nx=queue[qi];
 if(!queue.slice(qi).some(q=>q.t==='kum'&&q.c===it.c))pendingCheck={c:it.c,at:T+.9};
 if(nx&&nx.t==='kum'&&nx.c!==it.c&&!BOT){ding();vib(18);}
 if(!nx){state='settle';settleT=0;}
}
function layerCheck(c){pct=score();if(BOT)return;const a=layerScore[c];
 if(a>=.9){toast('Kusursuz katman!');chord(1);vib(20);}else if(a>=.78){toast('Güzel katman');chord(.6);}}
// Benzerlik: her sütunda, her katmanın üst çizgisi silik çizgiye kaç satır uzak? TOL satıra kadar tam puan, TOL+SCALE satırda sıfır.
// Kum zaman sırasıyla yığıldığı için sütundaki renk sayıları çizginin yüksekliğini verir.
const cntBuf=new Int32Array(16);
function score(){let tot=0;layerScore=new Array(ncol).fill(0);
 for(const x of scoreCols){cntBuf.fill(0);
  for(let y=FILLTOP-40;y<=YB;y++){const i=y*W+x,v=g[i];if(v>=3)cntBuf[v-3]++;else if(v===2)cntBuf[dlay[i]-1]++;}
  let cum=0;for(let k=0;k<ncol;k++){cum+=cntBuf[k];const e=Math.max(0,Math.abs(cum-(colBot[x]-topRow[k][x]))-TOL),sc=Math.max(0,1-e/SCALE);layerScore[k]+=sc;tot+=sc;}}
 const n=scoreCols.length;for(let k=0;k<ncol;k++)layerScore[k]/=n;return n?tot/(n*ncol)*100:0;}
function starsFor(p){let s=p>=STAR_TH[2]?3:p>=STAR_TH[1]?2:p>=STAR_TH[0]?1:0;if(s===3&&decorList.some(d=>!d.ok))s=2;return s;}

// ───────── Süsler ─────────
function beginHold(rec){state='hold';holdT=0;decor={rec,x:0,fy:0,vy:0,held:true};decorFollow();
 if(!BOT){toast('Yerine getir, dokun ve bırak');softBell();}}
function decorFollow(){const s=decor.rec.spr;decor.x=clamp(Math.round(noz)-(s.w>>1),Math.ceil(CX-hwMouth+1),Math.floor(CX+hwMouth-1-s.w));decor.fy=NOZY-s.h+4;}
function releaseDecor(){if(state!=='hold')return;state='drop';decor.held=false;decor.vy=.8;}
function fits(x,top){for(const[sx,sy]of decor.rec.spr.cells){const yy=top+sy;if(yy<1)continue;if(yy>=H||g[yy*W+x+sx]!==0)return false;}return true;}
function dropDecor(){decor.vy=Math.min(decor.vy+GRAV,VMAX);let mvv=decor.vy;
 while(mvv>0){const st=Math.min(1,mvv);if(fits(decor.x,Math.floor(decor.fy+st))){decor.fy+=st;mvv-=st;}else{landDecor();return;}}}
function landDecor(){const r=decor.rec,s=r.spr,top=Math.floor(decor.fy);
 const la=Math.min(ncol-1,r.s.oran>=1?r.k+1:r.k)+1;
 for(const[sx,sy,col]of s.cells){const i=(top+sy)*W+decor.x+sx;g[i]=2;dcol[i]=col;dlay[i]=la;}
 for(let y=top-3;y<top+s.h+3;y++)for(let x=decor.x-3;x<decor.x+s.w+3;x++)slp[y*W+x]=0;
 const cx=decor.x+(s.w-1)/2,cy=top+(s.h-1)/2;
 r.ok=Math.abs(cx-r.zx)<=8&&Math.abs(cy-r.zy)<=17;r.placed=true;r.at=[cx,cy];
 if(!BOT){thunk();vib(40);if(r.ok){toast('Tam yerinde! ✨');chime();}else toast('Biraz kaydı');}
 decor=null;qi++;state=queue[qi]?'pour':'settle';settleT=0;pourStart=T+.15;if(RD&&!BOT)gfxGuides();}

// ───────── Üfleme ─────────
// Huninin altındaki tepenin üstünü iki yana savurur: ortada derin, kenarda sığ.
function puff(){if(puffs<=0||!(state==='pour'||state==='hold'))return;puffs--;
 const cx=Math.round(noz);
 for(let x=cx-14;x<=cx+14;x++){if(x<lo-1||x>hi+1)continue;const k=Math.round(6.5*(1-Math.abs(x-cx)/15));let y=colSurf(x);
  for(let j=0;j<k&&y<=YB;j++,y++){const i=y*W+x;if(g[i]<3)break;
   const sg=x===cx?(rnd()<.5?-1:1):Math.sign(x-cx);
   parts.push({x,y:y-1,z:(rnd()-.5)*2.4,vx:sg*(.7+rnd()*1.8),vy:-(.6+rnd()*1.5),c:g[i]-3,s:sh[i]});g[i]=0;}}
 for(let y=NOZY;y<=YB;y++)for(let x=cx-20;x<=cx+20;x++)slp[y*W+x]=0;
 if(!BOT){puffSnd();vib([10,40,10]);updatePuffBtn();}}

// ───────── Final ─────────
function startFinale(){state='finale';finT=T;pct=score();finalStars=starsFor(pct);
 if(BOT){state='result';return;}
 setHiss(0);}
function finaleStep(){const f=T-finT;
 if(f<.5){const q=f/.5;lidY=1-q*q;}
 else if(!popped){popped=true;lidY=0;pop();vib(60);spawnConfetti();}
 sweep=f>=.7&&f<=1.8?(f-.7)/1.1:-1;
 if(f>=.9&&f<=2.6){waveY=YB-(f-.9)/1.6*(FILLH+18);
  for(let k=0;k<ncol;k++)if(!wavePlayed[k]&&waveY<=layerRow[k]){wavePlayed[k]=true;layerNote(k);vib(8);}}
 else if(f>2.6)waveY=-99;
 if(f>=2.75&&!snapped){snapped=true;saveResult();}
 if(f>=2.85&&!resultShown){resultShown=true;state='result';showResult();}}
function saveResult(){const r=SAVE.lv[LV]||{p:0,s:0};const p=Math.round(pct);
 if(p>=r.p){const im=snapshot();if(im)r.img=im;r.p=p;}r.s=Math.max(r.s||0,finalStars);SAVE.lv[LV]=r;persist();}
function showResult(){
 const p=Math.round(pct),s=finalStars;
 $('rTitle').textContent=['Şişe hazır','Güzel bir şişe','Çok güzel!','Kusursuz şişe!'][s];
 $('rPct').innerHTML='%'+p+' <small>benzerlik</small>';
 const stars=[...$('rStars').children];stars.forEach(e=>e.classList.remove('on'));
 stars.forEach((e,k)=>{if(k<s)setTimeout(()=>{e.classList.add('on');starPop(k);vib(25);},380+k*360);});
 let msg=s===0?'Bir yıldız için %'+STAR_TH[0]+' gerekli. Kumu silik çizgilere yakın dök.':

 for(let c=0;c<hf.C;c++){const x=hf.x0+c,X=(x+.5-CX)*WS,zm=hf.Z[c];
  for(let j=0;j<=hf.K;j++){const v=c*(hf.K+1)+j,o=v*3,q=-1+2*j/hf.K,z=zm*q,H=Hh(c,q);
   const dx=(Hh(c+1,q)-Hh(c-1,q))/(2*WS),dz=zm>1e-4?-2*hf.B[c]*q/zm:0,il=1/Math.hypot(dx,1,dz);
   hf.pos[o]=X;hf.pos[o+1]=H;hf.pos[o+2]=z;hf.nor[o]=-dx*il;hf.nor[o+1]=il;hf.nor[o+2]=-dz*il;
   hf.col[o]=hf.cr[c];hf.col[o+1]=hf.cg[c];hf.col[o+2]=hf.cb[c];hf.e[v]=hf.E[c];hf.uv[v*2]=X*3.2;hf.uv[v*2+1]=z*3.2;}}
 hf.geo.attributes.position.needsUpdate=hf.geo.attributes.normal.needsUpdate=hf.geo.attributes.color.needsUpdate=hf.geo.attributes.uv.needsUpdate=hf.geo.attributes.aE.needsUpdate=true;
 // huni
 const showF=state==='ready'||state==='pour'||state==='hold'||state==='drop'||state==='settle';RD.fun.visible=showF;
 if(showF){RD.fun.position.set((noz+.5-CX)*WS,(YB+1-NOZY)*WS,0);const it=queue[qi];
  if(it&&it.t==='kum'){const fr=it.n/it.n0,h=.12+fr*.2,rad=.014+(h-.1)/.24*.116;RD.fSand.visible=RD.fTop.visible=true;
   RD.fSandM.color.setRGB(RD.plin[it.c][0],RD.plin[it.c][1],RD.plin[it.c][2]);
   RD.fTop.scale.set(rad,rad,1);RD.fTop.position.y=h;RD.fSand.scale.set(rad*.98,1,rad*.98);RD.fSand.position.y=h+.02;RD.fSand.scale.y=.12;}
  else RD.fSand.visible=RD.fTop.visible=false;}
 // havadaki kum
 const P=RD.pts;let n=0;
 for(const p of parts){if(n>=P.max)break;const o=n*3,c=RD.plin[p.c],f=.88+p.s*.0009;P.pos[o]=(p.x+.5-CX)*WS;P.pos[o+1]=(YB+1-p.y)*WS;P.pos[o+2]=p.z*WS;P.col[o]=c[0]*f;P.col[o+1]=c[1]*f;P.col[o+2]=c[2]*f;P.size[n]=1.35;n++;}
 P.geo.setDrawRange(0,n);P.geo.attributes.position.needsUpdate=P.geo.attributes.aCol.needsUpdate=P.geo.attributes.aSize.needsUpdate=true;
 // süs: tutulurken ve düşerken voksel, düşeceği yere kesik çizgi, geri sayım halkası

 if(decor){const s=decor.rec.spr;let k=0;
  for(const[ax,ay,col]of s.art){const sx=decor.x+ax*SPRS+SPRS/2,sy=decor.fy+ay*SPRS+SPRS/2,X=(sx-CX)*WS,Y=(YB+1-sy)*WS;let Z=0;
   if(sy>MOUTH){const rr=(halfW(L.sekil,clamp(YB+.5-sy,0,YB-MOUTH))-1.4)*WS;Z=Math.sqrt(Math.max(0,rr*rr-X*X))*smooth(MOUTH-4,MOUTH+34,sy);}
   RD.dummy.position.set(X,Y,Z);RD.dummy.updateMatrix();vx3.setMatrixAt(k,RD.dummy.matrix);RD.tmpC.setRGB(toLin(col>>16&255),toLin(col>>8&255),toLin(col&255));vx3.setColorAt(k,RD.tmpC);k++;}
  vx3.count=k;vx3.instanceMatrix.needsUpdate=true;if(vx3.instanceColor)vx3.instanceColor.needsUpdate=true;
  if(decor.held){let ly=YB;for(let x=decor.x;x<decor.x+s.w;x++)ly=Math.min(ly,colSurf(x));const cx=(decor.x+s.w/2-CX)*WS;
   const a=RD.dropLine.geometry.attributes.position;a.setXYZ(0,cx,(YB+1-(decor.fy+s.h))*WS,0);a.setXYZ(1,cx,(YB+1-ly)*WS,0);a.needsUpdate=true;RD.dropLine.computeLineDistances();RD.dropLine.visible=true;
   const kq=Math.round(holdT/HOLD*40);if(kq!==RD.ringK){RD.ringK=kq;const x=RD.ringC.getContext('2d');x.clearRect(0,0,128,128);x.lineWidth=9;x.lineCap='round';
    x.strokeStyle='rgba(255,255,255,.35)';x.beginPath();x.arc(64,64,52,0,6.283);x.stroke();x.strokeStyle='#f2b53c';x.beginPath();x.arc(64,64,52,-1.571,-1.571+6.283*(1-kq/40));x.stroke();RD.ringT.needsUpdate=true;}
   const rs=(Math.max(s.w,s.h)+12)*WS;RD.ring.scale.set(rs,rs,1);RD.ring.position.set(cx,(YB+1-(decor.fy+s.h/2))*WS,.02);RD.ring.visible=true;}
  else{RD.dropLine.visible=false;RD.ring.visible=false;}}
 else{vx3.count=0;RD.dropLine.visible=false;RD.ring.visible=false;}
 // hedef çizgileri ve süs halkaları
 const it=queue[qi],gm=RD.guideMat.uniforms;gm.uCur.value=it&&it.t==='kum'?it.c:-1;gm.uTime.value=t;
 for(let k=0;k<3;k++){const r=decorList[k];if(!r||r.placed){RD.zones[k].w=0;continue;}RD.zones[k].set(r.zx+.5,r.zy+.5,9,decor&&decor.rec===r?2:1);}
 RD.wallMat.uniforms.uTime.value=t;RD.wallMat.uniforms.uWave.value=waveY;RD.glassMat.uniforms.uSweep.value=sweep;RD.gBack.material.uniforms.uSweep.value=sweep;
 // doğru yere dökerken düştüğü yer parlar; toz
 const gl=RD.glow;gl.visible=emitting&&onTarget;if(gl.visible){const s=.2+.04*Math.sin(t*9);gl.scale.set(s,s,1);gl.position.set((landX+.5-CX)*WS,(YB+1-landY)*WS,.05);gl.material.opacity=.75;}
 if(emitting&&RD.dustA.length<RD.dust.max&&Math.random()<.6){const c=RD.plin[(it&&it.c)||0];RD.dustA.push({x:(landX+.5-CX)*WS+(Math.random()-.5)*.08,y:(YB+1-landY)*WS,z:(Math.random()-.5)*.2,vx:(Math.random()-.5)*.08,vy:.05+Math.random()*.08,t:0,c});}
 const DS=RD.dust;RD.dustA=RD.dustA.filter(p=>(p.t+=1/60)<.9);n=0;for(const p of RD.dustA){p.x+=p.vx/60;p.y+=p.vy/60;const o=n*3,a=(1-p.t/.9)*.55;DS.pos[o]=p.x;DS.pos[o+1]=p.y;DS.pos[o+2]=p.z;DS.col[o]=(p.c[0]*.5+.5)*a;DS.col[o+1]=(p.c[1]*.5+.5)*a;DS.col[o+2]=(p.c[2]*.5+.5)*a;DS.size[n]=3+p.t*5;n++;}
 DS.geo.setDrawRange(0,n);DS.geo.attributes.position.needsUpdate=DS.geo.attributes.aCol.needsUpdate=DS.geo.attributes.aSize.needsUpdate=true;
 for(const nt of RD.notes){if(nt.t>1.3){nt.s.visible=false;continue;}nt.t+=1/60;nt.s.visible=true;nt.s.position.set(nt.x+Math.sin(nt.t*6)*.02,nt.y+nt.t*.22,.1);nt.s.material.opacity=1-nt.t/1.3;}
 // final: kapak, konfeti
 if(lidY!==null){RD.lid.visible=true;RD.lid.position.y=RD.lidY0+.05+lidY*1.1;}else RD.lid.visible=false;
 const CF=RD.conf;RD.confA=RD.confA.filter(p=>(p.t+=1/60)<2.4);n=0;for(const p of RD.confA){p.vy-=.006;p.x+=p.vx;p.y+=p.vy;p.z+=p.vz;const o=n*3;CF.pos[o]=p.x;CF.pos[o+1]=p.y;CF.pos[o+2]=p.z;CF.col[o]=p.c[0];CF.col[o+1]=p.c[1];CF.col[o+2]=p.c[2];CF.size[n]=p.s;n++;}
 CF.geo.setDrawRange(0,n);CF.geo.attributes.position.needsUpdate=CF.geo.attributes.aCol.needsUpdate=CF.geo.attributes.aSize.needsUpdate=true;
 RD.r.render(RD.scene,RD.cam);}
function spawnNote(){if(!RD)return;const nt=RD.notes.find(n=>n.t>1.3);if(!nt)return;nt.t=0;nt.x=(landX+.5-CX)*WS;nt.y=(YB+1-landY)*WS+.05;}
function spawnConfetti(){if(!RD)return;const y0=RD.lidY0+.1;for(let k=0;k<120;k++){const c=RD.plin[Math.floor(Math.random()*ncol)];RD.confA.push({x:(Math.random()-.5)*hwMouth*2*WS,y:y0,z:(Math.random()-.5)*.6,vx:(Math.random()-.5)*.02,vy:.03+Math.random()*.05,vz:(Math.random()-.5)*.02,s:3+Math.random()*4,c,t:0});}}
function snapshot(){if(!RD)return null;try{gfxFrame(performance.now());const c=RD.r.domElement,a=projectPx(-1.02,-.06,.92),b=projectPx(1.02,(YB+1-MOUTH)*WS+.13,.92),s=c.width/vw;
 const x0=Math.min(a.x,b.x),x1=Math.max(a.x,b.x),y0=Math.min(a.y,b.y),y1=Math.max(a.y,b.y),tw=164,th=Math.round(tw*(y1-y0)/(x1-x0));
 const tc=document.createElement('canvas');tc.width=tw;tc.height=th;tc.getContext('2d').drawImage(c,x0*s,y0*s,(x1-x0)*s,(y1-y0)*s,0,0,tw,th);return tc.toDataURL('image/jpeg',.84);}catch(e){return null;}}

// ───────── Arayüz ─────────
let lastPct=-1,toastT=null;
function toast(s){if(BOT)return;const e=$('toast');e.textContent=s;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),1100);}
function buildQueueBar(){const q=$('queue');q.innerHTML='';queue.forEach(it=>{const e=document.createElement('div');
 if(it.t==='kum'){e.className='seg';e.style.flexGrow=it.n0;e.style.background=PAL[L.katman[it.c][0]];e.innerHTML='<div class="f"></div>';}
 else{e.className='chip';e.textContent=it.rec.spr.e;}it.el=e;q.appendChild(e);});}
function updateHud(){const p=Math.round(pct);
 if(p!==lastPct){lastPct=p;$('pct').textContent='%'+p;$('pfill').style.width=p+'%';['m1','m2','m3'].forEach((id,k)=>$(id).classList.toggle('on',p>=STAR_TH[k]));}
 queue.forEach((it,k)=>{if(!it.el)return;it.el.classList.toggle('cur',k===qi&&state!=='finale'&&state!=='result');
  if(it.t==='kum'){const f=k<qi?1:k>qi?0:1-it.n/it.n0,fe=it.el.firstChild,w=(f*100).toFixed(1)+'%';if(fe.style.width!==w)fe.style.width=w;}
  else it.el.classList.toggle('done',k<qi);});}
function updatePuffBtn(){$('bPuff').querySelector('b').textContent=puffs;$('bPuff').classList.toggle('off',puffs<=0);}
function openRaf(){if(state!=='menu'){prevState=state;state='menu';}setHiss(0);$('result').classList.remove('show');
 const sh=$('shelves');sh.innerHTML='';let total=0,nextIdx=-1;
 for(let r=0;r<LEVELS.length;r+=3){const row=document.createElement('div');row.className='shelf';
  for(let k=r;k<Math.min(r+3,LEVELS.length);k++){const rec=SAVE.lv[k],open=k===0||(SAVE.lv[k-1]&&SAVE.lv[k-1].s>=1),s=rec?rec.s:0;total+=s;
   if(open&&!rec&&nextIdx<0)nextIdx=k;
   const b=document.createElement('button');b.className='slot'+(open?'':' lock')+(k===nextIdx?' next':'');
   b.innerHTML='<div class="jar">'+(rec&&rec.img?'<img alt="" src="'+rec.img+'">':'<div class="empty">'+(open?(k+1):'🔒')+'</div>')+'</div><div class="nm">'+(k+1)+' · '+LEVELS[k].ad+'</div><div class="st">'+'★'.repeat(s)+'<i>'+'★'.repeat(3-s)+'</i></div>';
   if(open)b.onclick=()=>{closeRaf(true);startLevel(k);};row.appendChild(b);}
  sh.appendChild(row);}
 $('rafSub').textContent=total+' / '+LEVELS.length*3+' ★';
 $('sSnd').textContent='Ses: '+(SAVE.snd===false?'kapalı':'açık');$('sHap').textContent='Titreşim: '+(SAVE.hap===false?'kapalı':'açık');
 $('rafClose').style.display=prevState&&L?'block':'none';$('raf').classList.add('show');}
function closeRaf(skip){$('raf').classList.remove('show');if(!skip&&prevState){state=prevState;if(state==='result')$('result').classList.add('show');}prevState=null;}

// ───────── Girdi ─────────
let down=false,lastX=0,downX=0,downY=0,downT=0,lastTapT=0;
cv.addEventListener('pointerdown',e=>{if(state==='menu'||state==='result'||state==='finale')return;down=true;lastX=downX=e.clientX;downY=e.clientY;downT=performance.now();
 try{cv.setPointerCapture(e.pointerId);}catch(_){}initAudio();if(state==='ready')beginPour();});
cv.addEventListener('pointermove',e=>{if(!down)return;nozT+=(e.clientX-lastX)/cellPx*GAIN;lastX=e.clientX;if(tickDue){tickDue=false;iosTap();}});
cv.addEventListener('pointerup',e=>{if(!down)return;down=false;const dist=Math.hypot(e.clientX-downX,e.clientY-downY),dt=performance.now()-downT;
 if(dist<10&&dt<260){if(state==='hold')releaseDecor();else{const now=performance.now();if(now-lastTapT<330&&puffs>0){puff();lastTapT=0;}else lastTapT=now;}}});
cv.addEventListener('pointercancel',()=>{down=false;});
['pointerup','touchend','click','keydown'].forEach(ev=>addEventListener(ev,()=>initAudio(),{passive:true}));

document.addEventListener('visibilitychange',()=>{if(!AC)return;if(document.hidden)AC.suspend().catch(()=>{});else AC.resume().catch(()=>{});});

// ───────── Döngü ─────────
let TS=1,last=performance.now(),acc=0,AUTO=null;
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.1,(now-last)/1000);last=now;
 if(TS>0&&!document.hidden){acc+=dt*TS;let n=0;while(acc>=DT&&n<4){step();acc-=DT;n++;}if(n===4)acc=0;}
 if(L&&state!=='menu'){gfxFrame(now);updateHud();}}

// ───────── Botlar (zorluk ayarı için) ─────────
// kusursuz: süpürür, eksik olan yerde yavaşlar, havadaki kumu da hesaba katar. insan: geç algı, küçük hata. dağınık: büyük hata.
// süpürücü: hiç düşünmeden sağa sola. dokunmayan: ortada durur.
function deficits(c,flight,pn){const def=new Float32Array(W),fl=new Float32Array(W),out=new Float32Array(W);
 const ph=[rnd()*6.28,rnd()*6.28,rnd()*6.28],am=pn?[gauss()*pn,gauss()*pn,gauss()*pn]:[0,0,0];
 if(flight)for(const p of parts)if(p.c===c)fl[Math.round(p.x)]++;
 for(let x=lo;x<=hi;x++){let f=0;for(let k=-6;k<=6;k++)f+=fl[clamp(x+k,lo,hi)];def[x]=colSurf(x)-1-topRow[c][x]-f/13+am[0]*Math.sin(x*.035+ph[0])+am[1]*Math.sin(x*.08+ph[1])+am[2]*Math.sin(x*.16+ph[2]);}
 for(let x=lo;x<=hi;x++){let s=0,n=0;for(let k=-4;k<=4;k++){const xx=x+k;if(xx>=lo&&xx<=hi){s+=def[xx];n++;}}out[x]=s/n;}
 return out;}
function botThink(pf,B){
 if(pf==='dokunmayan')return;
 if(pf==='supurucu'){if(state==='hold')return;nozT=noz+B.dir*120*DT;if(nozT>=hi)B.dir=-1;if(nozT<=lo)B.dir=1;return;}
 const P={kusursuz:{vb:168,vmax:336,vmin:14,re:0,bn:0,sn:0,slow:1,pn:0},insan:{vb:133,vmax:210,vmin:25,re:.15,bn:4,sn:.3,slow:.8,pn:4},daginik:{vb:119,vmax:168,vmin:42,re:.35,bn:13,sn:.6,slow:.35,pn:10}}[pf];
 if(state==='hold'){if(B.hold!==decor.rec){B.hold=decor.rec;B.haim=decor.rec.zx+gauss()*P.bn*.7;}
  nozT=noz+clamp(B.haim-noz,-P.vmax*DT,P.vmax*DT);if(Math.abs(noz-B.haim)<1.5&&holdT>P.re+.2)releaseDecor();return;}
 const it=queue[qi];if(!it||it.t!=='kum')return;
 if(T>=B.next){B.next=T+P.re+DT;B.def=deficits(it.c,true,P.pn);let a=-1,b=-1,bx=lo;
  for(let x=lo;x<=hi;x++){if(B.def[x]>.7){if(a<0)a=x;b=x;}if(B.def[x]>B.def[bx])bx=x;}
  if(a<0)a=b=bx;let sm=0,sn=0;for(let x=a;x<=b;x++)if(B.def[x]>0){sm+=B.def[x];sn++;}B.mean=sn?sm/sn:0;
  B.a=a+gauss()*P.bn;B.b=Math.max(B.a,b+gauss()*P.bn);}
 const d=B.def[clamp(Math.round(noz),lo,hi)];
 let v=d<=0?P.vmax:clamp(P.vb*Math.pow((B.mean+2)/(d+2),P.slow),P.vmin,P.vmax);v*=Math.max(.3,1+gauss()*P.sn*.3);
 if(noz<B.a-1)B.dir=1;else if(noz>B.b+1)B.dir=-1;else if(B.dir>0&&noz>=B.b)B.dir=-1;else if(B.dir<0&&noz<=B.a)B.dir=1;
 nozT=noz+B.dir*v*DT;}
function runBot(pf,n,sd){startLevel(n,{bot:true,seed:sd||1});beginPour();pourStart=0;
 const B={dir:1,next:0,aim:null};let k=0;while(state!=='result'&&k<60*150){botThink(pf,B);step();k++;}
 const res={bot:pf,bolum:n+1,yuzde:+pct.toFixed(1),yildiz:starsFor(pct),sus:decorList.map(d=>d.ok?'✓':'✗').join(''),sn:+(k*DT).toFixed(1)};
 BOT=false;return res;}

window.__game={setTS:v=>{TS=v;},sim:ms=>{const n=Math.round(ms/1000/DT);for(let k=0;k<n;k++)step();},
 state:()=>({state,level:LV,pct:+pct.toFixed(1),stars:starsFor(pct),qi,ql:queue.length,parts:parts.length,moved,noz,onTarget,streakLvl,puffs,gfx:!!RD}),
 autoplay:pf=>{AUTO=pf?{pf,B:{dir:1,next:0,aim:null}}:null;},tune:o=>{if(o.SCALE!=null)SCALE=o.SCALE;if(o.SPLASH!=null)SPLASH=o.SPLASH;if(o.FR!=null)FR=o.FR;if(o.MOMG!=null)MOMG=o.MOMG;},start:n=>startLevel(n),begin:()=>beginPour(),input:x=>{nozT=x;},release:()=>releaseDecor(),puff:()=>puff(),bot:runBot,levels:LEVELS.length};

// İlk açılış: menü yok, doğrudan 1. bölüm. Sonraki açılışlar raf.
initGfx();resize();
if(!SAVE.seen)startLevel(0);else{startLevel(Math.min(LEVELS.length-1,Object.keys(SAVE.lv).length));openRaf();prevState=null;$('rafClose').style.display='none';}
